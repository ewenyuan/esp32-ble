<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 BLE 遙控器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #333; margin-top: 30px; }
        .status { font-size: 1.1em; color: #666; margin-bottom: 40px; }
        .btn {
            display: block;
            width: 80%;
            max-width: 300px;
            margin: 15px auto;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:active { transform: scale(0.98); }
        .btn-connect { background-color: #007aff; color: white; }
        .btn-on { background-color: #34c759; color: white; display: none; }
        .btn-off { background-color: #ff3b30; color: white; display: none; }
    </style>
</head>
<body>

    <h1>ESP32 LED 控制器</h1>
    <div class="status" id="statusText">狀態：尚未連線</div>

    <!-- 連線按鈕 -->
    <button class="btn btn-connect" id="connectBtn" onclick="connectBLE()">連線到 ESP32</button>

    <!-- 控制按鈕（連線成功後才會顯示） -->
    <button class="btn btn-on" id="onBtn" onclick="sendInstruction('1')">開啟 LED ??</button>
    <button class="btn btn-off" id="offBtn" onclick="sendInstruction('0')">關閉 LED ??</button>

    <script>
        // 必須與您的 ESP32 程式碼 UUID 完全一致
        const SERVICE_UUID        = "4fa8c24a-18fb-11e3-8993-0002a5d5c51b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let ledCharacteristic = null;
        let bluetoothDevice = null;

        async function connectBLE() {
            const statusText = document.getElementById('statusText');
            statusText.innerText = "正在搜尋裝置...";

            try {
                // 1. 請求藍牙裝置（過濾特定的 Service UUID）
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                statusText.innerText = "正在連線到伺服器...";
                const server = await bluetoothDevice.gatt.connect();

                statusText.innerText = "正在獲取藍牙服務...";
                const service = await server.getPrimaryService(SERVICE_UUID);

                statusText.innerText = "正在獲取控制特徵值...";
                ledCharacteristic = await service.getPrimaryServiceCharacteristic ? 
                                    await service.getCharacteristic(CHARACTERISTIC_UUID) : 
                                    await service.getCharacteristic(CHARACTERISTIC_UUID);

                // 連線成功，切換 UI 按鈕
                statusText.innerText = "狀態：已連線 ??";
                statusText.style.color = "#34c759";
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('onBtn').style.display = 'block';
                document.getElementById('offBtn').style.display = 'block';

                // 監聽斷線事件
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                console.log(error);
                statusText.innerText = "連線失敗: " + error.message;
                statusText.style.color = "#ff3b30";
            }
        }

        // 發送指令（1 或 0）
        async function sendInstruction(value) {
            if (!ledCharacteristic) return;
            try {
                // 將字串轉為 ArrayBuffer 傳送
                const encoder = new TextEncoder();
                const data = encoder.encode(value);
                await ledCharacteristic.writeValue(data);
                console.log("指令發送成功: " + value);
            } catch (error) {
                alert("發送失敗: " + error);
            }
        }

        // 斷線處理
        function onDisconnected() {
            const statusText = document.getElementById('statusText');
            statusText.innerText = "狀態：連線已斷開 ?";
            statusText.style.color = "#666";
            document.getElementById('connectBtn').style.display = 'block';
            document.getElementById('onBtn').style.display = 'none';
            document.getElementById('offBtn').style.display = 'none';
        }
    </script>
</body>
</html>
