<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WS2812 & 蜂鳴器 藍牙控制器</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; color: #333; padding: 20px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 24px; margin: 8px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        .btn-disconnect { background-color: #dc3545; }
        .btn-disconnect:hover { background-color: #bd2130; }
        .btn-buzzer-on { background-color: #ffc107; color: black; }
        .btn-buzzer-off { background-color: #6c757d; }
        .control-group { background: white; padding: 20px; margin: 15px auto; max-width: 500px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status { font-weight: bold; color: #dc3545; }
        .connected { color: #28a745; }
        .pixel-control { display: inline-block; margin: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>藍牙裝置控制面板</h1>
    <p>連線狀態：<span id="status" class="status">尚未連線</span></p>
    <button id="connectBtn">連接藍牙設備</button>
    <button id="disconnectBtn" class="btn-disconnect" style="display:none;">中斷連線</button>

    <!-- 蜂鳴器控制區 -->
    <div class="control-group">
        <h2>🐝 蜂鳴器控制</h2>
        <button id="buzzerOn" class="btn-buzzer-on">鳴叫 (B1)</button>
        <button id="buzzerOff" class="btn-buzzer-off">關閉 (B0)</button>
    </div>

    <!-- WS2812 全體控制區 -->
    <div class="control-group">
        <h2>🎨 WS2812 全體燈效</h2>
        <button onclick="sendTx('L:ALL:255,0,0')">全亮紅光</button>
        <button onclick="sendTx('L:ALL:0,255,0')">全亮綠光</button>
        <button onclick="sendTx('L:ALL:0,0,255')">全亮藍光</button>
        <button onclick="sendTx('L:ALL:RAINBOW')">彩虹特效</button>
        <button onclick="sendTx('L:ALL:0,0,0')" style="background-color:#333;">全滅</button>
    </div>

    <!-- 5顆燈獨立控制區 -->
    <div class="control-group">
        <h2>🚨 5顆 LED 個別調色</h2>
        <div id="pixelContainer"></div>
    </div>

    <script>
        const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const TX_UUID      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

        let bluetoothDevice = null;
        let txCharacteristic = null;
        let lastSentTime = 0; // 用於計算發送間隔時間

        // 動態產生 5 顆燈的顏色選擇器
        const container = document.getElementById('pixelContainer');
        for (let i = 0; i < 5; i++) {
            container.innerHTML += `
                <div class="pixel-control">
                    <label>第 ${i+1} 顆：</label>
                    <input type="color" id="picker_${i}" value="#000000" onchange="updatePixelColor(${i})" oninput="updatePixelColorThrottled(${i})">
                </div>
            `;
        }

        // 連線藍牙 (接受所有裝置過濾器)
        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                document.getElementById('status').innerText = "正在搜尋裝置...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                txCharacteristic = await service.getCharacteristic(TX_UUID);

                document.getElementById('status').innerText = "已連線";
                document.getElementById('status').className = "status connected";
                document.getElementById('connectBtn').style.display = "none";
                document.getElementById('disconnectBtn').style.display = "inline-block";
                
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
            } catch (error) {
                console.log(error);
                document.getElementById('status').innerText = "連線失敗或取消";
            }
        });

        // 中斷連線
        document.getElementById('disconnectBtn').addEventListener('click', () => {
            if (bluetoothDevice) bluetoothDevice.gatt.disconnect();
        });

        function onDisconnected() {
            document.getElementById('status').innerText = "已斷開連線";
            document.getElementById('status').className = "status";
            document.getElementById('connectBtn').style.display = "inline-block";
            document.getElementById('disconnectBtn').style.display = "none";
        }

        // 發送資料的核心函式
        async function sendTx(message) {
            if (!txCharacteristic) return;
            try {
                let encoder = new TextEncoder();
                let data = encoder.encode(message + '\n');
                await txCharacteristic.writeValue(data);
                console.log("已發送: " + message);
            } catch (error) {
                console.error("發送失敗:", error);
            }
        }

        // 綁定蜂鳴器按鈕
        document.getElementById('buzzerOn').addEventListener('click', () => sendTx('B1'));
        document.getElementById('buzzerOff').addEventListener('click', () => sendTx('B0'));

        // ⚡ 網頁端節流防塞車設計：在拖曳/快速連續變更顏色時，強制限制每 60 毫秒才發送一次
        function updatePixelColorThrottled(index) {
            const now = Date.now();
            if (now - lastSentTime > 60) { 
                updatePixelColor(index);
                lastSentTime = now;
            }
        }

        function updatePixelColor(index) {
            const hexColor = document.getElementById(`picker_${index}`).value;
            const r = parseInt(hexColor.slice(1, 3), 16);
            const g = parseInt(hexColor.slice(3, 5), 16);
            const b = parseInt(hexColor.slice(5, 7), 16);
            sendTx(`L:${index}:${r},${g},${b}`);
        }
    </script>
</body>
</html>
